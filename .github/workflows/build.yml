name: Build TinyCC WPM packages

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      flavor:
        description: Package flavor
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.arch }} ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.flavor == 'release') && 'release' || 'debug' }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        arch: [x86, x64, arm64]
    env:
      FLAVOR: ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.flavor == 'release') && 'release' || 'debug' }}
      WPM_PRIVATE_KEY: ${{ secrets.WPM_SIGNING_PRIVATE_KEY }}

    steps:
      - name: Check out sources and TinyCC
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Install 32-bit MinGW
        if: matrix.arch == 'x86'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: true
          install: mingw-w64-i686-gcc

      - name: Add MinGW to PATH
        if: matrix.arch == 'x86'
        shell: pwsh
        run: Add-Content -LiteralPath $env:GITHUB_PATH -Value 'C:\msys64\mingw32\bin'

      - name: Install WPM
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'install-wpm.cmd'
          Invoke-WebRequest -UseBasicParsing `
            'https://github.com/Thewafflication/wpm/releases/latest/download/install.cmd' `
            -OutFile $installer
          & $installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare signing key
        id: signing
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WPM_PRIVATE_KEY)) {
            'cmake_arg=-DWPM_SIGNING_KEY=' >> $env:GITHUB_OUTPUT
            'signed=false' >> $env:GITHUB_OUTPUT
            Write-Host 'No signing secret is available; building an unsigned CI artifact.'
          } else {
            $keyPath = Join-Path $env:RUNNER_TEMP 'tinycc-package.private'
            [IO.File]::WriteAllText($keyPath, $env:WPM_PRIVATE_KEY)
            'cmake_arg=-DWPM_SIGNING_KEY=' + $keyPath >> $env:GITHUB_OUTPUT
            'signed=true' >> $env:GITHUB_OUTPUT
          }

      - name: Require signing for tagged releases
        if: startsWith(github.ref, 'refs/tags/v') && steps.signing.outputs.signed != 'true'
        shell: pwsh
        run: throw 'Tagged releases require the WPM_SIGNING_PRIVATE_KEY repository secret.'

      - name: Configure
        shell: pwsh
        run: cmake --preset "${{ matrix.arch }}-$env:FLAVOR" "${{ steps.signing.outputs.cmake_arg }}"

      - name: Build WPM package
        shell: pwsh
        run: cmake --build --preset "${{ matrix.arch }}-$env:FLAVOR"

      - name: Verify signed package
        if: steps.signing.outputs.signed == 'true'
        shell: pwsh
        run: |
          $package = Get-ChildItem out/packages/tinycc-${{ matrix.arch }}-*.zip -File
          if ($package.Count -ne 1) { throw "Expected one package, found $($package.Count)." }
          # The runner is ephemeral and this package was signed moments ago
          # with the injected key, so trust its embedded public key for verification.
          'y' | & 'C:\Program Files\WPM\wpm.exe' verify $package.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: tinycc-${{ matrix.arch }}-${{ env.FLAVOR }}
          path: out/packages/tinycc-${{ matrix.arch }}-*.zip
          if-no-files-found: error
          compression-level: 0
